name: Build Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "OpenWrt/ImmortalWrt SDK URL matching your router target"
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build frontend
        run: |
          cd web
          npm ci
          npm test
          npm run build

      - name: Verify generated assets are committed
        run: |
          git diff --exit-code -- \
            htdocs/luci-static/resources/flowlens/dist/flowlens-app.js \
            htdocs/luci-static/resources/flowlens/dist/flowlens-app.css

      - name: Validate backend and LuCI wrapper
        run: |
          node --check htdocs/luci-static/resources/view/flowlens/overview.js
          sh -n root/usr/libexec/rpcd/luci.flowlens
          tests/test_rpc_devices.sh

  package:
    name: Package
    needs: checks
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      SDK_URL: ${{ github.event.inputs.sdk_url || vars.FLOWLENS_SDK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require SDK URL
        run: |
          if [ -z "$SDK_URL" ]; then
            echo "Set workflow input sdk_url, or define repository variable FLOWLENS_SDK_URL for tag builds." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend bundle
        run: |
          cd web
          npm ci
          npm test
          npm run build

      - name: Install SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libelf-dev libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl zstd

      - name: Download SDK
        run: |
          mkdir -p sdk
          sdk_archive="$(basename "${SDK_URL%%\?*}")"
          curl --fail --location --show-error "$SDK_URL" --output "$sdk_archive"
          tar -xf "$sdk_archive" -C sdk --strip-components=1

      - name: Copy package into SDK
        run: |
          mkdir -p sdk/package/luci-app-flowlens
          rsync -a --delete \
            --exclude .git \
            --exclude sdk \
            --exclude web/node_modules \
            ./ sdk/package/luci-app-flowlens/

      - name: Build package
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-flowlens/compile V=s

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find sdk/bin/packages -type f \( -name 'luci-app-flowlens_*.ipk' -o -name 'luci-app-flowlens-*.apk' \) -print -exec cp -v {} artifacts/ \;
          test "$(find artifacts -type f | wc -l)" -gt 0

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-flowlens-packages
          path: artifacts/*
          if-no-files-found: error

      - name: Upload packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "FlowLens package build for $tag"
          gh release upload "$tag" artifacts/* --clobber
